name: Star chart

on:
  schedule:
    - cron: "0 6 * * 0" # 每周日 UTC 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  star-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch to star-chart branch
        run: |
          git config user.name "shieldcn[bot]"
          git config user.email "shieldcn[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin star-chart; then
            git fetch origin star-chart
            git checkout -B star-chart origin/star-chart
          else
            git checkout --orphan star-chart
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Render star chart
        uses: jal-co/shieldcn@v1
        with:
          theme: violet
          commit: false
          output: star-chart.svg

      - name: Commit and push
        run: |
          git add star-chart-dark.svg star-chart-light.svg
          if git diff --cached --quiet; then
            echo "Star chart unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: update star chart [skip ci]"
          git push -u origin star-chart
